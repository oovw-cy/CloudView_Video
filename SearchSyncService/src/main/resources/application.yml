server:
  port: 8101
  servlet:
    context-path: /api

spring:
  elasticsearch:
    uris: http://127.0.0.1:9200  # 你的ES地址
    username: elastic      # 如果有认证
    password: xxxx
    connection-timeout: 5s
    socket-timeout: 30s
  application:
    name: SearchSyncService
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/tianmu?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: xxxx
  data:
    redis:
      database: 15
      host: 127.0.0.1
      port: 6380
      timeout: 50000
      password: xxxx

      # 配置 redis 连接池
      lettuce:
        pool:
          # 链接池中最小的空闲链接 默认为 0
          min-idle: 4
          # 链接池中最大的空闲连接 默认为 8
          max-idle: 8
          #连接池中最大数据库链接数 默认为 8
          max-active: 8
          #连接池最大阻塞等待时间
          max-wait: 5000ms


canal:
  server:
    host: 127.0.0.1
    port: 11111
  destination: example
  username: xxxx
  password: xxxx
  filter: ".*\\..*"
  client:
    heartbeat:
      interval: 2000    # 心跳间隔(毫秒)
      timeout: 3000    # 心跳超时(毫秒)
    socket:
      timeout: 6000    # socket超时(毫秒)